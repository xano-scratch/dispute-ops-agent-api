<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dispute-ops-agent-api</title>
    <script>
      // Sets the `dark` class before first paint, so the page never flashes
      // light before switching. Keep this inline and above the stylesheet.
      (function () {
        try {
          // Follow the OS by default; allow ?theme=dark / ?theme=light to override.
          var forced = new URLSearchParams(window.location.search).get("theme");
          var media = window.matchMedia("(prefers-color-scheme: dark)");
          var dark = forced ? forced === "dark" : media.matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
